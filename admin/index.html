<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CPCP 管理后台</title><link rel="stylesheet" href="./style.css"></head><body><div class="mask" id="loginMask"><form class="login-card" id="loginForm" autocomplete="on"><div class="login-brand">CPCP<span>后台</span></div><p class="login-tip">默认口令 admin / admin123。生产环境请改环境变量 CPCP_ADMIN_PASS。</p><label class="field"><span>用户名</span><input id="loginUser" type="text" value="admin" autocomplete="username" spellcheck="false"></label><label class="field"><span>密码</span><input id="loginPass" type="password" value="admin123" autocomplete="current-password"></label><button class="btn primary block" type="submit" id="loginBtn">登录</button><div class="login-err" id="loginErr"></div></form></div><div class="app" id="app" hidden><aside class="side"><div class="brand">CPCP<span>后台</span></div><nav class="nav" id="nav"><button class="nav-item active" type="button" data-go="overview">概览</button><button class="nav-item" type="button" data-go="sites">站点</button><button class="nav-item" type="button" data-go="tokens">令牌</button><button class="nav-item" type="button" data-go="uploads">上传</button><button class="nav-item" type="button" data-go="stats">统计</button><button class="nav-item" type="button" data-go="settings">设置</button><button class="nav-item" type="button" data-go="data">导入导出</button></nav><div class="side-foot">CPCP-CLONE v1</div></aside><main class="main"><header class="topbar"><div class="crumb" id="crumb">概览</div><div class="topbar-right"><span class="who" id="who">admin</span><button class="btn ghost sm" type="button" id="logoutBtn">退出登录</button></div></header><div class="panels" id="panels"><section class="panel active" data-panel="overview"><div class="cards" id="ovCards"></div><div class="block"><div class="block-head"><h2>最近上传</h2><span class="hint">最近 10 条</span></div><div class="grid-upload" id="ovRecent"></div></div></section><section class="panel" data-panel="sites"><div class="block"><div class="block-head"><h2>站点列表</h2><button class="btn primary sm" type="button" id="siteNewBtn">新建站点</button></div><div class="table-wrap" id="siteList"></div></div><div class="block"><div class="block-head"><h2 id="siteFormTitle">编辑站点</h2><span class="hint" id="siteFormHint">从上方列表选一个站点，或点「新建站点」</span></div><div class="site-form" id="siteForm"></div></div></section><section class="panel" data-panel="tokens"><div class="block"><div class="block-head"><h2>令牌</h2><div class="row"><select class="input sm" id="tkFilter"></select><button class="btn primary sm" type="button" id="tkNewBtn">生成令牌</button></div></div><div class="inline-form" id="tkNewForm" hidden><label class="field"><span>站点</span><select class="input" id="tkNewSite"></select></label><label class="field"><span>令牌（留空自动生成 32 位）</span><input class="input mono" id="tkNewToken" placeholder="留空=随机 32 位" spellcheck="false"></label><label class="field"><span>备注</span><input class="input" id="tkNewNote" placeholder="可选"></label><label class="field"><span>过期时间（留空=永不过期）</span><input class="input" id="tkNewExp" type="datetime-local"></label><div class="row"><button class="btn primary sm" type="button" id="tkCreateBtn">确认生成</button><button class="btn ghost sm" type="button" id="tkCancelBtn">取消</button></div></div><div class="table-wrap" id="tkList"></div></div></section><section class="panel" data-panel="uploads"><div class="block"><div class="block-head"><h2>上传记录</h2><div class="row"><select class="input sm" id="upFilter"></select><button class="btn ghost sm" type="button" id="upReload">刷新</button></div></div><div class="grid-upload" id="upGrid"></div><div class="pager" id="upPager"></div></div></section><section class="panel" data-panel="stats"><div class="cards" id="stCards"></div><div class="block"><div class="block-head"><h2>每日请求</h2><span class="hint" id="stDailyHint">最近 14 天</span></div><div class="chart" id="stChart"></div></div><div class="two-col"><div class="block"><div class="block-head"><h2>站点分布</h2></div><div class="table-wrap" id="stBySite"></div></div><div class="block"><div class="block-head"><h2>IP 分布（前 20）</h2></div><div class="table-wrap" id="stByIp"></div></div></div></section><section class="panel" data-panel="settings"><div class="block"><div class="block-head"><h2>全局设置</h2><span class="hint" id="setHint"></span></div><div class="form-grid"><label class="field wide"><span>判重范围 dedupeScope</span><select class="input" id="setDedupe"><option value="session">session — 同一会话内判重</option><option value="site">site — 同站点判重（默认）</option><option value="global">global — 全站判重</option></select></label><label class="field wide"><span>单文件上限 maxUploadBytes</span><input class="input" id="setMax" type="number" min="1024" step="1024"></label><label class="field wide"><span>统计代码 analyticsSnippet（留空则不注入前台页面）</span><textarea class="input mono" id="setSnippet" rows="6" spellcheck="false" placeholder="留空 = 不注入任何第三方统计"></textarea></label><div class="row"><button class="btn primary" type="button" id="setSave">保存设置</button></div></div></div></section><section class="panel" data-panel="data"><div class="block"><div class="block-head"><h2>导出</h2><span class="hint">整库 JSON，不含管理员密码哈希</span></div><div class="row"><button class="btn primary" type="button" id="expBtn">下载 db.json</button></div></div><div class="block"><div class="block-head"><h2>导入</h2><span class="hint">覆盖导入，会替换当前全部数据</span></div><div class="row"><input class="input" id="impFile" type="file" accept=".json,application/json"><button class="btn danger" type="button" id="impBtn">开始导入</button></div><div class="hint" id="impHint">选择文件后先做本地校验（version / sites），通过后才提交给 /api/admin/import。</div></div></section></div></main></div><div class="toasts" id="toasts"></div><script src="./app.js"></script></body></html>
